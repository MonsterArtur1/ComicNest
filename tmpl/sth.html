<h1>Editing {{.Title}}</h1>

<form action="/search" method="POST">

    <input type="text" id="ftitle" name="ftitle"><br><br>
    <label for="lname">Issue:</label>

</form>
{{if not .ImageUrl}}
{{else}}
<img src={{.ImageUrl}} alt="Dinosaur" />
{{end}}
