<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<link rel="stylesheet" href="./tmpl/css/reset.css" type="text/css" />
	<link rel="stylesheet" href="./tmpl/css/styles_ipad.css" type="text/css" />
	<title>Folder</title>
</head>
<body>
	<div id="content">
		<div>

			<div id="folder-header">
				<div id="topIndex">   <a class="up" href="/">up</a>  </div>


				<div id="folder-subheader1">
				
					<h1>komiksy</h1>
				
				</div>

				<div id ="folder-subheader2">
					<a class="pat" href="/">Libraries</a> <img class="indicator" src="/images/indicator@2x.png" style="width: 5px"/> <a class="path" href="/library/1/folder/1">komiksy</a> 
				</div>
				<div id ="header-combos">
					

					

				</div>
			</div>

			<!--<a href="javascript:javascript:history.go(-1)">up</a>-->
			<div class="folderContent">
				<ul id="itemContainer">
					{{range $val := .Comics}}
					<li>
						<div class="cover">
							 <img style="width: 80px" src="{{$val.Image.ThumbUrl}}"/> 
						</div>
						<div class="info">
							<div class="title"><p>{{$val.Name}}</p>
							</div>
							<div class="elementInfo"> <span class="numPages">{{$val.IssueNumber}} issue</span> <span class="comicSize">X Mb</span>
							</div>
							<div class="buttons"> <a onclick="this.innerHTML='IMPORTING';this.className='importedButton';" class ="importButton" href="/library/1/comic/1">IMPORT</a> <a class ="readButton" href="/library/1/comic/1/remote">READ</a> 
							</div>
						</div>
						
					</li>
					{{end}}
					
					
				</ul>
				<div class="clear">&nbsp;</div>
			</div>
		</div>

		

		<script type="text/javascript">
		function navigateTo(sel, target) {
			window[target].location.href = sel.options[sel.selectedIndex].value;
		}
		</script>

	</body>
	</html>
