# Buduje ComicNest po każdym commicie: testy + binaria na kilka platform.
#
# - push na dowolną gałąź i pull request: go vet, go test, kompilacja na
#   Windows/Linux/macOS; binaria trafiają do artefaktów workflow (90 dni).
# - push na main: dodatkowo odświeżany jest pre-release "latest" z binariami,
#   więc najnowszą wersję da się zawsze pobrać z zakładki Releases.
# - tag v* (np. v1.2.0): pełne wydanie z binariami i notatkami z historii commitów.
name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: write # potrzebne do publikowania release'ów

env:
  GO_VERSION: "1.25"

jobs:
  test:
    name: Testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  build:
    name: Binarium ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: linux,   goarch: amd64, ext: "" }
          - { goos: linux,   goarch: arm64, ext: "" }
          - { goos: darwin,  goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe potrzebuje tagów
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Wersja
        id: ver
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -o "dist/comicnest-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/comicnest
          cp config_example.yaml dist/
      - uses: actions/upload-artifact@v4
        with:
          name: comicnest-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 90

  release:
    name: Publikacja
    needs: build
    # Pre-release "latest" po każdym commicie na main, pełne wydanie po tagu v*.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    concurrency: release-${{ github.ref }} # dwa szybkie pushe na main nie ścigają się o "latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zbierz binaria
        run: |
          mkdir -p dist
          find artifacts -type f -name 'comicnest-*' -exec cp {} dist/ \;
          cp config_example.yaml dist/
          ls -l dist
      - name: Pre-release "latest" (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* \
            --prerelease --target "$GITHUB_SHA" \
            --title "Najnowsza wersja (main @ ${GITHUB_SHA::7})" \
            --notes "Automatyczny build z commita ${GITHUB_SHA} na gałęzi main. Ta wersja jest nadpisywana po każdym commicie — do stabilnej instalacji użyj wydania z numerem."
      - name: Wydanie z tagu
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ComicNest $GITHUB_REF_NAME" --generate-notes
