# Builds ComicNest on every commit: tests + binaries for several platforms.
#
# - push to main: go vet, go test, cross-compilation for Windows/Linux/macOS;
#   binaries are kept as workflow artifacts (90 days) and the "latest"
#   pre-release is refreshed, so the newest build can always be downloaded
#   from Releases. The Docker image is pushed to Docker Hub as :latest and :main-<sha>.
# - tag v* (e.g. v1.2.0): full release with binaries and generated notes;
#   Docker image tagged :1.2.0, :1.2, :1 and :latest.
#   Publish with: git tag v1.2.0 && git push origin v1.2.0
name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
permissions:
  contents: write # required to publish releases

env:
  GO_VERSION: "1.25"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  build:
    name: Binary ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: linux,   goarch: amd64, ext: "" }
          - { goos: linux,   goarch: arm64, ext: "" }
          - { goos: darwin,  goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Version
        id: ver
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -o "dist/comicnest-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/comicnest
          cp config_example.yaml dist/
      - uses: actions/upload-artifact@v4
        with:
          name: comicnest-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 90

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/comicnest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - name: Version
        id: ver
        run: |
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ver.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish
    needs: build
    # "latest" pre-release after every commit on main, full release on a v* tag.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    concurrency: release-${{ github.ref }} # two quick pushes to main must not race for "latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect binaries
        run: |
          mkdir -p dist
          find artifacts -type f -name 'comicnest-*' -exec cp {} dist/ \;
          cp config_example.yaml dist/
          ls -l dist
      - name: Pre-release "latest" (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (main @ ${GITHUB_SHA::7})" \
            --notes "Automatic build of commit ${GITHUB_SHA} on the main branch. This release is overwritten on every commit — for a stable install use a numbered release."
      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ComicNest $GITHUB_REF_NAME" --generate-notes
