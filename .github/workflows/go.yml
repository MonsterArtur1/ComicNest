# Builds ComicNest only when a version tag is pushed.
#
# Example:
#   git tag v1.2.0
#   git push origin v1.2.0
#
# This will:
# - run tests
# - build binaries for Windows/Linux/macOS
# - publish GitHub Release named exactly like the tag, e.g. v1.2.0
# - publish Docker image tagged exactly like the Git tag, e.g. :v1.2.0

name: Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.25"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  build:
    name: Binary ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: linux,   goarch: amd64, ext: "" }
          - { goos: linux,   goarch: arm64, ext: "" }
          - { goos: darwin,  goarch: arm64, ext: "" }

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Version
        id: ver
        run: echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -o "dist/comicnest-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/comicnest

          cp config_example.yaml dist/

      - uses: actions/upload-artifact@v4
        with:
          name: comicnest-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 90

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/comicnest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        run: |
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.ref_name }}
            ${{ steps.image.outputs.image }}:latest
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest

    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p dist
          find artifacts -type f -name 'comicnest-*' -exec cp {} dist/ \;
          cp config_example.yaml dist/
          ls -l dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
