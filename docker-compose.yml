# ComicNest in Docker. Copy this file, adjust the comics path, then:
#   docker compose up -d
# First start creates ./config/config.yaml — add users / ComicVine key there,
# then `docker compose restart`. Open http://<host>:8080/ and click "Skanuj bibliotekę".
services:
  comicnest:
    image: ghcr.io/monsterartur1/comicnest:latest
    container_name: comicnest
    ports:
      - "8080:8080"
    volumes:
      - /path/to/your/comics:/comics:ro   # comic library (read-only)
      - ./config:/config                   # config.yaml
      - ./data:/data                       # SQLite database + cover cache (keep on a local disk, not SMB/NFS)
    environment:
      # Optional overrides; anything set here beats config.yaml.
      # COMICNEST_COMICVINE_API_KEY: ""
      # COMICNEST_OPDS_ENABLED: "true"
      # COMICNEST_PAGE_SIZE: "60"
      TZ: Europe/Warsaw
    # The image runs as UID 65532; make ./config and ./data writable for it
    # (chown -R 65532:65532 config data) or run as your own user instead:
    # user: "1000:1000"
    healthcheck:
      test: ["CMD", "/comicnest", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
