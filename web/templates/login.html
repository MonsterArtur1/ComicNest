{{define "login"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in — ComicNest</title>
    <link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/static/favicon.png" type="image/png" sizes="192x192">
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-body">
<main class="login-box">
    <h1 class="brand"><img class="brand-logo" src="/static/favicon.png" alt="" width="40" height="40"><span class="brand-name">Comic<span>Nest</span></span></h1>
    <p class="login-hint">Log in with your ComicNest account. The same password works in the OPDS reader.</p>
    {{if .Error}}<p class="flash flash-error">{{.Error}}</p>{{end}}
    <form method="post" action="/login" class="login-form">
        <input type="hidden" name="next" value="{{.Next}}">
        <label>Username
            <input type="text" name="name" value="{{.Name}}" autocomplete="username" autofocus required>
        </label>
        <label>Password
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    {{with appVersion}}
    <footer class="site-footer">
        <a href="https://github.com/MonsterArtur1/ComicNest" target="_blank" rel="noopener" title="ComicNest on GitHub">ComicNest {{.}}</a>
    </footer>
    {{end}}
</main>
</body>
</html>{{end}}
