{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{block "title" .}}ComicNest{{end}}</title>
    <link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/static/favicon.png" type="image/png" sizes="192x192">
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/styles.css">
    {{if opdsEnabled}}<link rel="alternate" type="application/atom+xml;profile=opds-catalog;kind=navigation" title="ComicNest OPDS" href="/opds">{{end}}
    <script src="/static/htmx.min.js" defer></script>
</head>
<body>
<header class="topbar">
    <a class="brand" href="/"><img class="brand-logo" src="/static/favicon.png" alt="" width="32" height="32"><span class="brand-name">Comic<span>Nest</span></span></a>
    <form class="search" action="/search" method="get">
        <input type="search" name="q" placeholder="Search series or issue…" value="{{block "searchQuery" .}}{{end}}">
    </form>
    {{if opdsEnabled}}<a class="opds-badge" href="/opds" title="OPDS catalog address — paste it into your comic reader (Panels, Chunky, Moon+ Reader, Librera…)">OPDS</a>{{end}}
    {{if isAdmin}}<a class="btn btn-mini admin-link" href="/admin" title="Admin panel">⚙ <span>Admin</span></a>{{end}}
    {{with currentUser}}
    <form class="user-box" action="/logout" method="post" title="Logged in as {{.}}">
        <span class="user-name">👤 {{.}}</span>
        <button type="submit" class="btn btn-mini">Log out</button>
    </form>
    {{end}}
</header>
<main class="content">
{{block "content" .}}{{end}}
</main>
</body>
</html>{{end}}
