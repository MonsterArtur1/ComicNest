{{define "reader"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>{{.Title}} — ComicNest</title>
    <link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/static/favicon.png" type="image/png" sizes="192x192">
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/reader.js" defer></script>
</head>
<body class="reader-body">
<main id="reader" class="reader"
      data-issue="{{.Issue.ID}}"
      data-total="{{.Total}}"
      data-start="{{.StartPage}}"
      data-prev="{{.PrevIssueID}}"
      data-next="{{.NextIssueID}}"
      data-back="/issues/{{.Issue.ID}}"
      data-series="/series/{{.Series.ID}}">

    <header class="reader-bar reader-top">
        <a class="reader-back" href="/issues/{{.Issue.ID}}" title="Back to issue (Esc)">◂</a>
        <span class="reader-title" title="{{.Title}}">{{.Title}}</span>
        <span class="reader-counter"><span id="page-num">{{.StartPage}}</span> / {{.Total}}</span>
        <div class="reader-tools">
            <button type="button" data-zoom="fit-h" title="Fit height (0)">↕</button>
            <button type="button" data-zoom="fit-w" title="Fit width (w)">↔</button>
            <button type="button" data-zoom="out" title="Zoom out (−)">−</button>
            <span id="zoom-label" class="reader-zoom-label">auto</span>
            <button type="button" data-zoom="in" title="Zoom in (+)">+</button>
            <button type="button" id="fullscreen" title="Fullscreen (f)">⛶</button>
        </div>
    </header>

    <div id="stage" class="reader-stage">
        <img id="page" class="reader-page" alt="page" draggable="false">
        <div class="reader-zone reader-zone-prev" data-nav="prev" title="Previous page"></div>
        <div class="reader-zone reader-zone-menu" data-nav="menu"></div>
        <div class="reader-zone reader-zone-next" data-nav="next" title="Next page"></div>
        <div id="loading" class="reader-loading" hidden>Loading…</div>
    </div>

    <footer class="reader-bar reader-bottom">
        {{if .PrevIssueID}}<a class="reader-issue-link" href="/issues/{{.PrevIssueID}}/read" title="Previous issue">◂◂</a>{{end}}
        <button type="button" data-nav="prev" title="Previous (←)">◂</button>
        <input id="slider" type="range" min="1" max="{{.Total}}" value="{{.StartPage}}" step="1" aria-label="Page">
        <button type="button" data-nav="next" title="Next (→)">▸</button>
        {{if .NextIssueID}}<a class="reader-issue-link" href="/issues/{{.NextIssueID}}/read" title="Next issue">▸▸</a>{{end}}
    </footer>
</main>
</body>
</html>{{end}}
