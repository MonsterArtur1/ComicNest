# Example ComicNest configuration. Copy to config.yaml next to the binary
# and adjust. Every key the app supports has an entry here with a
# description — when adding a new option, update this file too (see SPECIFICATION §4).
# Every key can be overridden with the COMICNEST_<KEY> environment variable
# (e.g. COMICNEST_LISTEN=0.0.0.0, COMICNEST_COMICVINE_API_KEY=...); the path
# to this file comes from the -config flag or COMICNEST_CONFIG.
#
# User accounts are NOT in this file — you create them from the browser, in
# the admin panel at /admin. Until an account exists, the app runs
# completely open and treats you as an anonymous administrator, so you can
# create the first account there (it becomes an admin automatically).

port: 8080                    # HTTP server port
listen: 0.0.0.0               # listen interface: "localhost" = this computer only, "0.0.0.0" = the whole local network (needed by OPDS readers)
library: "D:/Library"         # comic library root (scanned recursively: cbz/cbr/pdf)
# libraries: multiple independent libraries instead of one — each gets its own
# scan button and statistics in the admin panel, and a switcher in the main
# menu ("all libraries" aggregates them there). Takes precedence over
# `library` above when set (leave `library` in place, it's just ignored).
# OPDS is unaffected: it always serves one combined catalog across all of them.
# libraries:
#   - "D:/Library/Marvel"
#   - "D:/Library/DC"
# A library's display name (else its folder's own name) can be changed from
# the admin panel's per-library "Rename" field — that's stored in the
# database, not here, and applies right away with no restart.
data_dir: ./data              # runtime data: the SQLite database (database.sqlite, including user accounts) and cover cache (covers/)
comicvine_api_key: ""         # key from https://comicvine.gamespot.com/api/; empty = ComicVine matching/scraping disabled (the UI says so)
opds_enabled: true            # OPDS catalog under /opds (see §9a); logs in with the same accounts as the web UI
# kosync_enabled: true        # KOReader progress sync server under /kosync (default false; see §9b); same accounts as the web UI — log in to the web UI once after enabling
page_size: 60                 # series tiles per library page; 0 = no pagination
panel_detection:              # the reader's Guided View (panel-by-panel reading)
  sensitivity: normal         # low | normal | high — high splits more aggressively (finds more panels, more false splits on busy art); low only cuts along clean gutters (COMICNEST_PANEL_SENSITIVITY)
  # gutter_tolerance: 0       # advanced: how far (0..128 gray levels) a pixel may be from the gutter colour and still count as gutter; 0 = automatic
  # min_panel_area: 0         # advanced: smallest panel as a fraction of the page area (e.g. 0.01); 0 = the sensitivity's default
# Changing panel_detection needs a restart; cached panel layouts are then
# recomputed as pages are opened.

# comicvine_api_key, opds_enabled, kosync_enabled and page_size can also be edited from the
# admin panel (/admin) instead of this file — page_size applies right away,
# the others need a restart. A COMICNEST_<KEY> environment variable, when
# set, always wins over an edit made there.
