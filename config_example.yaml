# Przykładowa konfiguracja ComicNest. Skopiuj do config.yaml obok binarium
# i dostosuj. Każdy klucz obsługiwany przez aplikację ma tu wpis z opisem —
# przy dodawaniu nowej opcji uzupełnij ten plik (patrz SPECIFICATION §4).
# Każdy klucz można nadpisać zmienną środowiskową COMICNEST_<KLUCZ>
# (np. COMICNEST_LISTEN=0.0.0.0, COMICNEST_COMICVINE_API_KEY=...); ścieżkę
# tego pliku wskazuje flaga -config albo COMICNEST_CONFIG.
#
# Konta użytkowników NIE są w tym pliku — zakładasz je z przeglądarki, w
# panelu administracyjnym pod /admin. Dopóki nie ma żadnego konta, aplikacja
# działa całkiem otwarta i traktuje Cię jak anonimowego administratora, żebyś
# mógł tam założyć pierwsze konto (zostanie adminem automatycznie).

port: 8080                    # port HTTP serwera
listen: 0.0.0.0               # interfejs nasłuchu: "localhost" = tylko ten komputer, "0.0.0.0" = cała sieć lokalna (potrzebne czytnikom OPDS)
library: "D:/Library"         # korzeń biblioteki komiksów (skanowany rekursywnie: cbz/cbr/pdf)
data_dir: ./data              # dane runtime: baza SQLite (database.sqlite, w tym konta użytkowników) i cache okładek (covers/)
comicvine_api_key: ""         # klucz z https://comicvine.gamespot.com/api/; puste = dopasowanie/scrape ComicVine wyłączone (UI to komunikuje)
opds_enabled: true            # katalog OPDS pod /opds (patrz §9a); logowanie tymi samymi kontami co WWW
page_size: 60                 # kafelków serii na stronę biblioteki; 0 = bez paginacji
